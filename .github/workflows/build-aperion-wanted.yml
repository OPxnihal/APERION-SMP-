name: Build APERION Wanted

on:
  push:
    paths:
      - "AperionWanted-1.0.0-source/aperion-wanted/**"
      - ".github/workflows/build-aperion-wanted.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AperionWanted-1.0.0-source/aperion-wanted
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.0.0"

      - name: Build shaded plugin JAR
        run: gradle --no-daemon clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: APERION-Wanted-1.0.0
          path: AperionWanted-1.0.0-source/aperion-wanted/build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: APERION Wanted ${{ github.ref_name }}
          generate_release_notes: true
          files: AperionWanted-1.0.0-source/aperion-wanted/build/libs/*.jar
